; Radar Connect — BLE central tap for the FX True Ballistic radar.
; Connects to the confirmed radar MAC, dumps the GATT tree, subscribes to
; notifications, and prints shot data as hex.

[env:radar_connect]
platform = espressif32
board = esp32dev                ; change to upesy_wroom if that's your board
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.3.3
