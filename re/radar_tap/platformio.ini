; Radar Tap — passive BLE scanner to observe the FX True Ballistic radar.
; Standalone research tool, separate from the main device firmware.

[env:radar_tap]
platform = espressif32
board = esp32dev                ; change to upesy_wroom if that's your spare board
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.3.3
