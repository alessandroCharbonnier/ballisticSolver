; Weather dongle — remote T/P/RH sensor node.
; ESP32 classic + BME280 (0x76) + SH1106 OLED (0x3C), ESP-NOW broadcast every 10 s.
; Prototype runs on USB power; deep sleep added later for battery.

[env:weather_dongle]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit BME280 Library@^2.3.0
    olikraus/U8g2 @ ^2.35.19
    h2zero/NimBLE-Arduino @ ^2.3.3
